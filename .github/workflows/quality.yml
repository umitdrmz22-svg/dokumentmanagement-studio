name: Qualitätsprüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript-Syntax prüfen
        run: |
          for file in assets/config.js assets/app.js assets/app-core.js assets/app-workflow.js assets/production-auth.js; do node --check "$file"; done
      - name: Deploy-Lizenzvertrag prüfen
        run: |
          test -f .github/workflows/ehs-module-gate.yml
          grep -Fq 'defidev-legal/ehs-entitlement-gate.js' .github/workflows/ehs-module-gate.yml
          grep -Fq 'ehs_dokumentmanagement_monthly' .github/workflows/ehs-module-gate.yml
      - name: Smoke-Test dreimal ausführen
        run: |
          for PASS in 1 2 3; do echo "QA pass $PASS"; node tests/smoke.test.js; done
